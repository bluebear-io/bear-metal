# Dependabot PRs that pass the Dependabot gate (.github/workflows/dependabot-gate.yml)
# are approved and merged automatically. The 28-day cooldown and the semver-major
# ignore keep version updates within that gate; security updates bypass both, and
# the gate then leaves majors and young releases to a human reviewer.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    cooldown:
      default-days: 28
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
    open-pull-requests-limit: 5
    labels: ["dependencies", "javascript"]

  - package-ecosystem: "github-actions"
    directory: "/"
    cooldown:
      default-days: 28
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:15"
    open-pull-requests-limit: 5
    labels: ["dependencies", "github-actions"]
